[package]
name = "plugin-pkg"
description = "Client plugin packages (.tspkg), manifests, signatures and the approval store"
edition.workspace = true
version.workspace = true
license.workspace = true

# The pure half of client plugins (docs/implementation/client-plugins.md §10): safe, engine-free
# and with no other port crate as a dependency, because the port client and tsmod-launcher both
# link it. Versions match tsmod-launcher's where it already has the crate.
[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
