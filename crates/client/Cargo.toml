[package]
name = "ts-client"
edition.workspace = true
version.workspace = true
license.workspace = true

# Game logic, free of `unsafe` (`#![deny(unsafe_code)]`). The exported library is `ts-client-dll`.
[lib]
name = "ts_client"

[dependencies]
goldsrc = { path = "../goldsrc", features = ["client"] }
shared  = { path = "../shared" }
ts-gameplay = { path = "../gameplay" }
ts-client-ext-api = { path = "../client-ext-api" }
# Restart and reconnect (src/relaunch): launcher.toml and .reconnect, version requirements, and
# the cards' glyphs (font8x8, MIT).
font8x8 = { version = "0.3", default-features = false }
semver = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# Client plugin packages, the approval store and verification (crates/plugin-pkg, issue #297).
plugin-pkg = { path = "../plugin-pkg" }
# Server offers (src/plugins/offers, issue #299; client-plugins.md §6.3): a blocking HTTP(S) client
# on worker threads, rustls with the webpki roots and ring (open question 2), as tsmod-launcher has.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

# Tests only: the core's tests run the 3.0 plugin's movement and gun rules (its fixture's `pm`
# and `gun`). The library never links a ruleset (docs/implementation/gameplay-plugins.md).
[dev-dependencies]
ts30-gameplay = { path = "../ts30" }
tempfile = "3"

[features]
# The relaunch e2e test's hooks (`cargo xtask relaunch`, src/relaunch/e2e.rs): card answers and a
# self-relaunch override, read from the environment. Never in a shipped build.
e2e = []
